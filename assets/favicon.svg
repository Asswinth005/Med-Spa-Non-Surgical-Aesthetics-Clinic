<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="clinicRoseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBB1A3" />
      <stop offset="45%" stop-color="#B88A78" />
      <stop offset="100%" stop-color="#9A6956" />
    </linearGradient>
    <filter id="clinicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Premium rounded tile base -->
  <rect width="64" height="64" rx="16" fill="url(#clinicRoseGradient)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FFF7F2" stroke-opacity="0.35" stroke-width="1.5" fill="none" />

  <!-- Signature Lumineau Clinic Mark (Diamond-Lotus Contour + Radiance Core + Harmonious Arc) -->
  <g transform="translate(32, 32) scale(1.4) translate(-18, -18)" filter="url(#clinicGlow)">
    <!-- Faceted Diamond & Petal Form -->
    <path d="M18 6 L28 14 L18 26 L8 14 Z" fill="#FFFFFF" fill-opacity="0.97"/>
    <!-- Inner Radiance Core -->
    <circle cx="18" cy="16" r="3.5" fill="#FFFFFF" fill-opacity="0.75"/>
    <!-- Elegant Lower Uplift Arch -->
    <path d="M10 28 L18 22 L26 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  </g>
</svg>
